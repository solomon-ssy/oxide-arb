[package]
name = "quant-pivot-bin"
description = "Binary entry point for the quant-pivot trading system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quant-pivot"
path = "src/main.rs"

[features]
# The default feature set is the production profile: analysis-only output is
# not dry-run — report sizing runs the real portfolio optimizer and classical
# model runtime, so a full research deployment links them. S3/Polars/Parquet
# are linked only by the explicit `research-jobs` deployment feature.
#   - optimize:    argmin weight-refinement for the weighted trainer.
#   - ml-classical: smartcore classical trainer + runtime for shadow candidates.
default = [
  "serving",
  "research-jobs",
  "domain-chainlink",
  "optimize",
  "ml-classical",
]
serving = ["quant-pivot-core/serving"]
research-jobs = ["quant-pivot-core/research-jobs"]
domain-chainlink = ["quant-pivot-core/domain-chainlink"]
ml-classical = ["research-jobs", "quant-pivot-core/ml-classical"]
optimize = ["research-jobs", "quant-pivot-core/optimize"]

[dependencies]
quant-pivot-allocator = { workspace = true }
quant-pivot-compute = { workspace = true }
quant-pivot-core = { workspace = true, default-features = false }
quant-pivot-models = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[lints]
workspace = true
