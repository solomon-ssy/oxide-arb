[package]
name = "quant-pivot-bin"
description = "Binary entry point for the quant-pivot trading system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quant-pivot"
path = "src/main.rs"

[features]
# The default feature set is the production profile: `report_only` is
# not dry-run — report sizing runs the real portfolio optimizer and classical
# model runtime, so a deployed binary must always link them. `dataframe` is
# always linked transitively via quant-pivot-core's research dependency.
#   - optimize:    argmin weight-refinement for the weighted trainer.
#   - ml-classical: smartcore classical trainer + runtime for shadow candidates.
default = ["optimize", "ml-classical"]
ml-classical = ["quant-pivot-core/ml-classical"]
optimize = ["quant-pivot-core/optimize"]

[dependencies]
quant-pivot-core = { workspace = true, default-features = false }
quant-pivot-models = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[lints]
workspace = true
