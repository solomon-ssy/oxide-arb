[package]
name = "quant-pivot-bin"
description = "Binary entry point for the quant-pivot trading system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quant-pivot"
path = "src/main.rs"

[dependencies]
quant-pivot-core = { workspace = true }
quant-pivot-models = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[lints]
workspace = true
