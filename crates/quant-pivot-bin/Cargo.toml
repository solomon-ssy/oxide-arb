[package]
name = "quant-pivot-bin"
description = "Binary entry point for the quant-pivot trading system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quant-pivot"
path = "src/main.rs"

[features]
# Production ML profile: links the classical (smartcore) trainer + runtime so a
# deployed binary can train and load registered classical Candidate versions, and
# the argmin weight-refinement step for the weighted trainer. Enabled by the
# deploy/CI profile (kept off the default build so a `report_only` binary stays
# free of the heavy native-adjacent ML stack).
ml-classical = ["quant-pivot-core/ml-classical"]
optimize = ["quant-pivot-core/optimize"]

[dependencies]
quant-pivot-core = { workspace = true }
quant-pivot-models = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }

[lints]
workspace = true
