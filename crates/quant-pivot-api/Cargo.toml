[package]
name = "quant-pivot-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["domain-chainlink"]
domain-chainlink = [
  "dep:chainlink-data-streams-report",
  "dep:chainlink-data-streams-sdk",
]

[dependencies]
quant-pivot-allocator = { workspace = true }
quant-pivot-compute = { workspace = true }
quant-pivot-error = { workspace = true, features = ["serde"] }
quant-pivot-models = { workspace = true }
chainlink-data-streams-report = { workspace = true, optional = true }
chainlink-data-streams-sdk = { workspace = true, optional = true }
num-traits = { workspace = true }

# Polymarket SDK
polymarket_client_sdk_v2 = { workspace = true }

# Ethereum / Polygon
alloy = { workspace = true }
hypersync-client = { workspace = true }

# Networking
reqwest = { workspace = true }
httpdate = { workspace = true }

# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
flate2 = { workspace = true }
tokio-tungstenite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
sha2 = { workspace = true }
zip = { workspace = true }

# Decimal
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }

# Time
chrono = { workspace = true }
chrono-tz = { workspace = true }
grib = { workspace = true }

# Concurrency
ahash = { workspace = true }
parking_lot = { workspace = true }
flume = { workspace = true }

# Retry
backoff = { workspace = true }

# Rate limiting
governor = { workspace = true }

# Logging
tracing = { workspace = true }

# Error
thiserror = { workspace = true }

# Security
blake3 = { workspace = true }
zeroize = { workspace = true }
hex = { workspace = true }

# Async trait
async-trait = { workspace = true }

# URL
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = { workspace = true }
testcontainers = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
alloy = { workspace = true }

[lints]
workspace = true
