[package]
name = "quant-pivot-repository"
description = "Data access layer: repository pattern for SeaORM entities and ClickHouse timeseries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
quant-pivot-error = { workspace = true, features = ["storage"] }
quant-pivot-models = { workspace = true, features = ["persistence-entities"] }
quant-pivot-storage = { workspace = true }
num-traits = { workspace = true }
sea-orm = { workspace = true }
sea-query = { workspace = true }
casbin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
clickhouse = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rust_decimal = { workspace = true }
sea-orm = { workspace = true, features = ["mock"] }

[lints]
workspace = true
