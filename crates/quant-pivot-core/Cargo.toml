[package]
name = "quant-pivot-core"
description = "System hub: AppContext, data ingest, governance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# ── Workspace internal ─────────────────────────────────────────────
quant-pivot-allocator  = { workspace = true }
quant-pivot-error      = { workspace = true, features = ["storage", "config", "serde"] }
quant-pivot-models     = { workspace = true }
quant-pivot-migration  = { workspace = true }
quant-pivot-api        = { workspace = true, default-features = false }
quant-pivot-storage    = { workspace = true }
quant-pivot-repository = { workspace = true }
quant-pivot-research   = { workspace = true, default-features = false }
quant-pivot-web        = { workspace = true }

# ── Async runtime ──────────────────────────────────────────────────
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { workspace = true, features = ["rt", "time"] }
futures-util = { workspace = true }
async-trait  = { workspace = true }
num-traits   = { workspace = true }

# ── Serialization ──────────────────────────────────────────────────
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2       = { workspace = true }
blake3     = { workspace = true }
zeroize    = { workspace = true }

# ── Money / time ───────────────────────────────────────────────────
rust_decimal       = { workspace = true }
rust_decimal_macros = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
uuid   = { workspace = true, features = ["v4", "v7"] }
alloy  = { workspace = true }

# ── Errors / logging ──────────────────────────────────────────────
tracing   = { workspace = true }

# ── Concurrency ────────────────────────────────────────────────────
ahash       = { workspace = true }
dashmap     = { workspace = true }
parking_lot = { workspace = true }
arc-swap    = { workspace = true }
flume       = { workspace = true }
rayon       = { workspace = true }

# ── Resilience ─────────────────────────────────────────────────────

# ── Observability ──────────────────────────────────────────────────
prometheus = { workspace = true }
teloxide   = { workspace = true, features = ["macros"] }
reqwest    = { workspace = true, features = ["json"] }

# ── Cache ──────────────────────────────────────────────────────────

# ── Misc ───────────────────────────────────────────────────────────
rand = { workspace = true }
strum = { workspace = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_json = { workspace = true }
loom = { workspace = true }
proptest = { workspace = true }

[features]
default = ["serving", "research-jobs", "domain-chainlink"]
serving = []
research-jobs = ["quant-pivot-research/research-jobs"]
domain-chainlink = ["quant-pivot-api/domain-chainlink"]
# Offline optimizer (argmin) for the weighted trainer's refinement step.
optimize = ["research-jobs", "quant-pivot-research/optimize"]
# Classical ML (smartcore) shadow candidates: trainer + runtime.
ml-classical = ["research-jobs", "quant-pivot-research/ml-classical"]

[lints]
workspace = true
