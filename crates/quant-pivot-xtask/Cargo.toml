[package]
name = "quant-pivot-xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "quant-pivot-xtask"
path = "src/main.rs"

[dependencies]
quant-pivot-allocator = { workspace = true }
quant-pivot-compute = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
hex = { workspace = true }
quant-pivot-api = { workspace = true }
quant-pivot-error = { workspace = true, features = ["storage"] }
quant-pivot-models = { workspace = true }
polymarket_client_sdk_v2 = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
quant-pivot-migration = { path = "../quant-pivot-migration" }
quant-pivot-repository = { workspace = true }
quant-pivot-storage = { workspace = true }
quant-pivot-system-tests = { workspace = true }
quote = { workspace = true }
rustls = { workspace = true }
rust_decimal = { workspace = true }
schemars = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true }
tokio-util = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
