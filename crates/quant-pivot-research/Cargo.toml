[package]
name = "quant-pivot-research"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Quant-pivot feature, factor, and model materialization pipeline"

[dependencies]
quant-pivot-error = { path = "../quant-pivot-error" }
quant-pivot-models = { path = "../quant-pivot-models" }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
uuid = { workspace = true, features = ["v5"] }
# Deterministic Tier-1 linkage template parsing (11.2.2).
regex = { workspace = true }
url = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }

# ── Research numeric stack ────────────────────────────────────────────────────
# Pure-Rust, lightweight, and load-bearing for the online feature plane (rolling
# statistics, realized vol, CPU-parallel batch build), so these are base deps,
# not gated. The heavy / native-adjacent stacks below stay feature-gated.
ndarray = { workspace = true }
statrs = { workspace = true }
rayon = { workspace = true }

# ── Heavy / offline stack (feature-gated; see [features]) ─────────────────────
polars = { workspace = true, optional = true }
parquet = { workspace = true, optional = true }
argmin = { workspace = true, optional = true }
argmin-math = { workspace = true, optional = true }
smartcore = { workspace = true, optional = true, features = ["serde"] }
bincode = { workspace = true, optional = true }
good_lp = { workspace = true, features = ["microlp"] }

[dev-dependencies]
proptest = { workspace = true }
rust_decimal_macros = { workspace = true }

[features]
# The pure-Rust microlp backend is the sole baseline allocator and is therefore
# a normal dependency. Heavy and native-adjacent stacks stay opt-in.
default = []
# Offline feature / dataset materialization (lazy frames + parquet).
dataframe = ["dep:polars", "dep:parquet"]
# Factor-weight / threshold optimization.
optimize = ["dep:argmin", "dep:argmin-math"]
# Classical ML (tree / ensemble / linear) for shadow candidates.
ml-classical = ["dep:smartcore", "dep:bincode"]
# Optional native HiGHS backend for large-scale MILP (never a report_only hard
# dependency; only linked when this feature is explicitly enabled).
lp-solver-highs = ["good_lp/highs"]

[lints]
workspace = true
