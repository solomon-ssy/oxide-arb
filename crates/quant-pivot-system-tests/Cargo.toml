[package]
name = "quant-pivot-system-tests"
description = "Cross-crate system verification against one disposable infrastructure stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
quant-pivot-allocator = { workspace = true }
quant-pivot-compute = { workspace = true }
quant-pivot-api = { workspace = true }
quant-pivot-core = { workspace = true, features = ["ml-classical"] }
quant-pivot-error = { workspace = true, features = ["storage"] }
quant-pivot-migration = { workspace = true }
quant-pivot-models = { workspace = true }
quant-pivot-repository = { workspace = true }
quant-pivot-research = { workspace = true, default-features = false, features = ["research-jobs"] }
quant-pivot-storage = { workspace = true }
anyhow = { workspace = true }
alloy = { workspace = true }
async-trait = { workspace = true }
aws-config = { workspace = true }
aws-sdk-s3 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clickhouse = { workspace = true }
flume = { workspace = true }
futures-util = { workspace = true }
hdrhistogram = { workspace = true }
hex = { workspace = true }
hypersync-net-types = { workspace = true }
num-traits = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true, features = ["postgres", "redis"] }
tikv-jemalloc-ctl = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
wiremock = { workspace = true }

[dev-dependencies]
bitcode = { workspace = true }
casbin = { workspace = true }
redis = { workspace = true }
sea-orm-migration = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
