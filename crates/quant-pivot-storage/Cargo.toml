[package]
name = "quant-pivot-storage"
description = "Database initialization, connection management, schema migrations, and unified cache layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
test-util = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
quant-pivot-error = { workspace = true, features = ["storage"] }
quant-pivot-models = { workspace = true, features = ["repository"] }
num-traits = { workspace = true }
sea-orm = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bitcode = { workspace = true }
prometheus = { workspace = true }
moka = { workspace = true }
deadpool-redis = { workspace = true }
redis = { workspace = true }
clickhouse = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
blake3 = { workspace = true }
flume = { workspace = true }
parking_lot = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
quant-pivot-migration = { path = "../quant-pivot-migration" }
tokio = { workspace = true, features = ["test-util"] }
# `rust_decimal_macros::dec!` expands to `::rust_decimal::Decimal` in integration tests.
rust_decimal = { workspace = true }
rust_decimal_macros = { workspace = true }
quant-pivot-test-support = { workspace = true }
sea-orm-migration = { workspace = true }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["rust_decimal"]

[lints]
workspace = true
