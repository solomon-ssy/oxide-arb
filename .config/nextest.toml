nextest-version = { required = "0.9.140", recommended = "0.9.140" }

[profile.ci]
default-filter = "not package(quant-pivot-system-tests)"
fail-fast = false
leak-timeout = { period = "500ms", result = "fail" }
retries = 0

[profile.ci.junit]
path = "junit.xml"
report-name = "quant-pivot-unit-contract"
store-failure-output = true
store-success-output = false

[profile.system]
default-filter = "package(quant-pivot-system-tests)"
fail-fast = false
global-timeout = "45m"
leak-timeout = { period = "1s", result = "fail" }
retries = 0
test-threads = 1
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "30s" }

[profile.system.junit]
path = "junit.xml"
report-name = "quant-pivot-system"
store-failure-output = true
store-success-output = false
