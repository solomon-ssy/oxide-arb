[package]
edition = "2021"
name = "smartcore"
version = "0.5.5"
authors = ["smartcore Developers"]
build = false
exclude = [
    ".github",
    ".gitignore",
    "smartcore.iml",
    "smartcore.svg",
    "tests/",
    "AGENTS.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Machine Learning in Rust."
homepage = "https://smartcorelib.org"
documentation = "https://docs.rs/smartcore"
readme = "README.md"
keywords = [
    "machine-learning",
    "statistical",
    "ai",
    "optimization",
    "linear-algebra",
]
categories = ["science"]
license = "Apache-2.0"
repository = "https://github.com/smartcorelib/smartcore"

[features]
datasets = [
    "std_rand",
    "serde",
]
default = []
js = ["getrandom/wasm_js"]
ndarray-bindings = ["dep:ndarray"]
serde = [
    "dep:serde",
    "dep:typetag",
]
std_rand = [
    "rand/std_rng",
    "rand/std",
    "rand/thread_rng",
]

[lib]
name = "smartcore"
path = "src/lib.rs"

[dependencies.approx]
version = "0.5.1"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.ndarray]
version = "0.17"
optional = true

[dependencies.num]
version = "0.4"

[dependencies.num-traits]
version = "0.2.12"

[dependencies.ordered-float]
version = "5.1.0"

[dependencies.rand]
version = "0.10.1"
features = ["alloc"]
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true

[dev-dependencies.bincode]
version = "1.3.1"

[dev-dependencies.itertools]
version = "0.15.0"

[dev-dependencies.serde_json]
version = "1.0"

[target.'cfg(all(target_arch = "wasm32", not(target_os = "wasi")))'.dev-dependencies.wasm-bindgen-test]
version = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.typetag]
version = "0.2"
optional = true

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom]
version = "0.4"
optional = true

[profile.release]
lto = true
codegen-units = 1
overflow-checks = true
strip = true

[profile.test]
