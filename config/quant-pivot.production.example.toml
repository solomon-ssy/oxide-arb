# ═══════════════════════════════════════════════════════════════════════════════
# quant-pivot — Deploy Configuration (Production Example)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Copy this file to `quant-pivot.toml` and fill in REAL values.
#
# This file contains ONLY deploy configuration (restart to apply). Operator
# policy semantics are managed through independently revisioned, governed
# Config resources (UI: System → Config):
#
# API versioning is header-driven (`Accept-Api-Version: v1`):
#   GET  /api/config/resources
#   POST /api/config/{kind}/drafts
#   POST /api/config/{kind}/drafts/{id}/validate
#   POST /api/config/{kind}/drafts/{id}/approve
#   POST /api/config/{kind}/drafts/{id}/activate
#
# Loading precedence (later wins):
#   1. compiled-in defaults
#   2. quant-pivot.toml
#   3. quant-pivot.local.toml (optional and gitignored)
#
# Secret values are plaintext TOML strings and are held in memory as zeroizing,
# non-serializable `SecretText`. Restrict the deployed file to mode 0600 and
# replace every explicit `REPLACE_WITH_...` value before startup.
#
# Unknown keys are FATAL at startup (deny_unknown_fields): stale sections from
# older layouts ([detection], [risk], [sizing], [treasury], [analytics], ...)
# abort boot instead of being silently ignored.

# ── Deployment lifecycle ─────────────────────────────────────────────────────

[lifecycle]
environment = "production"
# Keep this pre-production until the irreversible seal has been written. After
# sealing, change both this declaration and project-lifecycle.toml to
# production_frozen before the next deployment; startup rejects any mismatch.
expected_state = "pre_production_resettable"
# Git commit and clean/dirty state are embedded by the compiled artifact.
# Backup/restore and protected Config E2E evidence are WORM database artifacts.

# ── Polymarket Platform ───────────────────────────────────────────────────────

[polymarket]
# Purpose: CLOB REST base URL (order placement, balances, market reads).
# Impact: all REST trading traffic. Caution: change only for Polymarket
# endpoint migrations. Default: "https://clob.polymarket.com".
clob_base_url = "https://clob.polymarket.com"
# Purpose: CLOB market-data WebSocket URL (books, ticks).
# Impact: the entire real-time data pipeline. Default shown.
clob_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
# Purpose: hard timeout for the single money-changing POST /order attempt.
# Impact: timeout is Ambiguous and enters reconciliation; it is never retried.
# Default: 15000.
order_post_timeout_ms = 15000
# Purpose: EVM chain id. Impact: order signing domain + on-chain reads.
# Caution: must be Polygon (137) — any other value is fatal at startup.
# Default: 137.
chain_id = 137

# CTF oracle / on-chain reads + governed redeem transactions.
[polymarket.onchain]
# Purpose: Polygon JSON-RPC endpoint. Impact: CTF resolution oracle and
# on-chain redemption. The protected full URL is redacted from Debug/log/UI.
rpc_endpoint = { source = "protected", url = "https://REPLACE_WITH_POLYGON_RPC_HOST/v2/REPLACE_WITH_PROVIDER_KEY" }
# Purpose: RPC request timeout (ms). Impact: hard per-call bound on the Polygon
# JSON-RPC client — a money-moving redeem/oracle call fails after this instead
# of hanging (reqwest has no default timeout). Default: 10000.
rpc_timeout_ms = 10000

# Gasless relayer for money-moving Proxy / Gnosis Safe transactions (e.g. CTF
# redeemPositions). Only required when quant.account.wallet_kind is "proxy" or
# "gnosis_safe"; EOA settlement signs + pays gas directly and ignores this.
[polymarket.relayer]
# Purpose: relayer submit/status base URL. Default: "https://relayer-v2.polymarket.com".
base_url = "https://relayer-v2.polymarket.com"
# Purpose: plaintext relayer API key.
api_key = "REPLACE_WITH_POLYMARKET_RELAYER_API_KEY"
# Purpose: address that owns the relayer API key (the signer EOA address).
# api_key_address = "0x...."
# Purpose: relayer HTTP request timeout (ms). Default: 15000.
request_timeout_ms = 15000

# ── Market Data Connections ───────────────────────────────────────────────────
# Decision thresholds are governed policy fields, not Deploy Config.

# Heartbeats: polymarket_client_sdk_v2 (`heartbeats` feature), not app-level ping.
[market_data.websocket]
# Purpose: initial reconnect backoff (ms) after a dropped WS connection.
# Impact: data-gap duration after disconnects. Default: 1000.
reconnect_delay_ms = 1000
# Purpose: reconnect backoff ceiling (ms). Default: 30000.
max_reconnect_delay_ms = 30000
# Purpose: token subscriptions per WS connection before opening a new shard.
# Impact: connection count vs per-connection event volume. Caution: Polymarket
# enforces server-side limits — keep at or below 200. Default: 200.
max_subscriptions_per_connection = 200
# Purpose: maximum engine-owned CLOB token subscriptions across all transport
# shards. Impact: hard caps Polymarket WS pressure. Default: 2000.
engine_max_subscription_tokens = 2000
# Purpose: look-ahead window (hours) for the engine WS subscription hotset.
# Impact: markets outside this window stay in catalog/storage but do not consume
# WS capacity until they approach resolution. Default: 72.
engine_subscription_window_hours = 72

[market_data.gamma]
# Purpose: Gamma REST base URL (market catalog + resolution metadata).
# Default: "https://gamma-api.polymarket.com".
base_url = "https://gamma-api.polymarket.com"
# Purpose: interval (s) between full market-catalog syncs (also the periodic
# gamma task cadence). Impact: how quickly new/closed markets are picked up.
# Default: 300.
reconcile_interval_secs = 300
# Purpose: catalog pagination page size. Impact: sync request count.
# Default: 100.
page_size = 100
# Hard safety budgets for a complete keyset scan, including retry attempts.
max_keyset_pages = 10000
max_keyset_requests = 50000

[market_data.data_api]
# Keyless venue positions (GET /positions?user=<funder>) for the report capital base.
base_url = "https://data-api.polymarket.com"
page_size = 500
size_threshold = 1

# ── Quant Pivot (Phase 0) ─────────────────────────────────────────────────────

[quant.workers]
report_schedule_poll_secs = 1
report_run_lease_secs = 120
report_run_heartbeat_secs = 30
report_ad_hoc_queue_capacity = 64
report_ad_hoc_queue_ttl_secs = 300
# Report TTL expire-sweep + deadline look-ahead cadence (seconds). Default: 300.
report_expire_sweep_secs = 300
# Order-intent TTL expire-sweep cadence (seconds); releases reserved capital at
# expires_at. Default: 60.
intent_expire_sweep_secs = 60
# Auto-execution dispatcher poll-backstop cadence (seconds). Default: 10.
execution_dispatch_secs = 10
# Execution-breaker self-heal tick cadence (seconds). Default: 5.
execution_breaker_tick_secs = 5
# Best-effort equity-history snapshot cadence (seconds). Default: 300.
equity_snapshot_secs = 300

[quant.account]
# Polymarket proxy/funder address for Data API position reads. Required (all modes).
# funder = "0x...."
# Wallet shape for money-moving on-chain settlement: "eoa" signs + pays gas
# directly; "proxy" / "gnosis_safe" redeem via the relayer. Default: "eoa".
wallet_kind = "eoa"

# ── Research Plane ────────────────────────────────────────────────────────────

[research.artifact_store]
# Local development uses `kind = "local"` and treats `prefix` as a filesystem
# root. Production evidence must use `kind = "s3"` with bucket versioning and
# Object Lock enabled; startup verifies both controls before publication.
kind = "s3"
bucket = "REPLACE_WITH_WORM_ARTIFACT_BUCKET"
prefix = "quant-pivot/production"
region = "REPLACE_WITH_AWS_REGION"
path_style = false
require_object_lock = true
require_versioning = true

[research.evidence_attestation]
# Exactly 32 secret bytes encoded as 64 lowercase hex characters. During
# rotation, move the old active value into previous_signing_keys.
signing_key = "REPLACE_WITH_EVIDENCE_SIGNING_KEY"
previous_signing_keys = []

# ── Keys / Credentials ───────────────────────────────────────────────────────
#
# All modes require private_key + funder for real account reads; signing/submission
# applies only in semi_auto / auto_execution. L2 credentials are SDK-derived at connect.

[keys]
# Bot wallet private key: the single signing credential; CLOB L2 credentials are
# SDK-derived from it at connect time.
private_key = "REPLACE_WITH_POLYMARKET_PRIVATE_KEY"

# ── Observability (logging only) ─────────────────────────────────────────────
# Metrics are always-on via the web server's GET /metrics; operator alerting
# Telegram/webhook bindings are Deploy Config; event routing is OperationalControl.

[observability]
# Purpose: default tracing filter directive (e.g. "info",
# "info,quant_pivot_core=debug"). Impact: log verbosity for the whole process.
# Caution: the RUST_LOG environment variable, when set, overrides this value
# entirely. Default: "info".
log_level = "info"
# Purpose: emit JSON-structured log lines instead of human-readable text.
# Impact: machine-parseable logs for aggregation — keep enabled in production.
# Default: false.
log_json = true

[notifications.telegram]
bot_token = "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
chat_id = "REPLACE_WITH_TELEGRAM_CHAT_ID"

[notifications.webhook]
url = "https://REPLACE_WITH_ALERT_WEBHOOK"
authorization = "Bearer REPLACE_WITH_WEBHOOK_TOKEN"

# ── Database ─────────────────────────────────────────────────────────────────

[db.postgres]
# Purpose: Postgres host (system of record: trades, positions, governance,
# RBAC). Default: "localhost".
host = "REPLACE_WITH_PG_HOST"
# Purpose: Postgres port. Default: 5432.
port = 5432
# Purpose: single role used by runtime, schema commands, reset and lifecycle
# coordination.
user = "quant_pivot"
# Purpose: plaintext database password. Restrict this file to mode 0600.
password = "REPLACE_WITH_POSTGRES_PASSWORD"
# Purpose: database name. Default: "quant_pivot".
database = "quant_pivot"
# Purpose: schema search path. Default: "public".
schema = "public"
# Purpose: pool upper bound. Impact: worst-case concurrent repository access.
# Caution: size against the server's max_connections. Default: 10.
max_connections = 20
# Purpose: pool warm floor. Default: 2.
min_connections = 5
# Purpose: TCP connect timeout (s). Impact: exceeding it fails the boot
# readiness gate. Default: 10.
connect_timeout_secs = 10
# Purpose: idle connection reap timeout (s). Default: 300.
idle_timeout_secs = 300
# Purpose: pool acquire timeout (s). Impact: exceeding indicates pool
# exhaustion — queries fail fast instead of queueing forever. Default: 10.
acquire_timeout_secs = 10
# Purpose: max connection lifetime (s) before recycling — bounds server-side
# state. Default: 1800.
max_lifetime_secs = 1800
# Purpose: per-connection statement_timeout (ms); 0 disables. Impact: kills
# runaway queries. Default: 30000.
statement_timeout_ms = 30000
# Purpose: idle_in_transaction_session_timeout (ms); 0 disables. Impact:
# kills idle transactions holding locks — prevents lock pile-ups.
# Default: 60000.
idle_in_transaction_timeout_ms = 60000
# Purpose: lock_timeout (ms); 0 disables. Default: 5000.
lock_timeout_ms = 5000
# Purpose: per-operation sort/hash memory, passed verbatim to PostgreSQL.
# Caution: raise only with server headroom. Default: "16MB".
work_mem = "16MB"
# Purpose: post-connect self-check that session GUCs took effect (catches
# PgBouncer stripping startup options). Caution: keep enabled in production —
# silently missing statement_timeout is dangerous. Default: true.
verify_session_params = true
# Purpose: prepared-statement cache capacity per connection. Default: 256.
statement_cache_capacity = 256
# Purpose: application name reported to pg_stat_activity (ops triage).
# Default: "quant-pivot".
application_name = "quant-pivot"

# PostgreSQL apply also requires a one-time bootstrap administrator password
# mounted as a 0400/0600 regular file and referenced by:
# QUANT_PIVOT_BOOTSTRAP__ADMIN_PASSWORD_FILE

[db.clickhouse]
# Stable application deployment and ClickHouse Cloud service identities included
# in signed evidence scope hashes.
deployment_id = "REPLACE_WITH_DEPLOYMENT_ID"
cluster_id = "REPLACE_WITH_CLICKHOUSE_CLOUD_SERVICE_ID"
# Purpose: ClickHouse HTTP endpoint (analytics timeseries: ticks, books,
# detections, evidence). ClickHouse Cloud HTTP/TLS endpoint uses port 8443.
url = "https://REPLACE_WITH_CH_HOST:8443"
# Purpose: database name. Default: "quant_pivot".
database = "quant_pivot"
# Purpose: single identity used by runtime and explicit schema commands.
user = "quant_pivot"
# Purpose: plaintext database password.
password = "REPLACE_WITH_CLICKHOUSE_PASSWORD"
# Purpose: max age (s) of a partial batch before flush. Impact: analytics
# freshness vs insert request volume. Caution: production favors a smaller
# flush interval + larger batches for high tick volume. Default: 5.
flush_interval_secs = 5
# Purpose: rows per insert batch; a full batch flushes immediately. Impact:
# larger batches amortize insert overhead; sized for the L2 tick feed
# (~3K rows/s peaks). Default: 5000.
batch_size = 5000
# Purpose: maximum concurrent insert operations (semaphore). Impact: caps
# write pressure on the CH server under burst load. Default: 8.
max_concurrent_inserts = 8

# ── Cache ────────────────────────────────────────────────────────────────────

[cache]
# Purpose: global cache operation timeout (ms); per-domain overrides win.
# Default: 500.
operation_timeout_ms = 500
# Purpose: cache failures are transparent to callers (fall through to the
# source of truth). Caution: fail-closed (false) makes Redis a hard
# dependency of every cached read — disable only for debugging. Default: true.
fail_open = true
# Purpose: disable the entire cache layer (all operations become no-ops).
# Impact: degraded performance. Default: false.
disabled = false

[cache.redis]
# Purpose: Redis host (L2 cache + JWT revocation). Caution: isolate
# environments — never share one Redis DB between prod and staging without
# distinct key prefixes. Default: "localhost".
host = "REPLACE_WITH_REDIS_HOST"
# Purpose: Redis port. Default: 6379.
port = 6379
# Purpose: ACL username. Leave empty for password-only auth. Default: "".
user = ""
# Purpose: plaintext Redis authentication secret.
password = "REPLACE_WITH_REDIS_PASSWORD"
# Purpose: logical database index. Default: 0.
database = 0
# Purpose: connection pool size. Impact: size against peak concurrent web +
# cache traffic. Default: 8.
pool_size = 16
# Purpose: per-operation timeout (ms). Default: 1000.
timeout_ms = 500
# Purpose: startup readiness budget (ms): total time allowed to establish and
# PING the first connection (cache + JWT blacklist pools) before failing closed.
# Kept separate from timeout_ms so a tight per-op deadline never starves initial
# connection establishment. Default: 5000.
connect_timeout_ms = 5000
# Purpose: key namespace prefix. Default: "qp:".
key_prefix = "qp:"

[cache.moka]
# Purpose: in-process (L1) cache entry capacity. Impact: memory vs hit rate.
# TTLs are per-entry, chosen by each call site — no global TTL knob exists.
# Default: 10000.
max_capacity = 50000

# ── Web Server + RBAC ────────────────────────────────────────────────────────

[web]
# Purpose: bind address. Caution: keep the port behind a reverse proxy /
# firewall when binding all interfaces. Default: "0.0.0.0".
listen_host = "0.0.0.0"
# Purpose: bind port (REST + WS + Prometheus GET /metrics). Default: 8080.
listen_port = 8080
# Purpose: allowed CORS origins; empty disables cross-origin requests.
# Caution: lock to the dashboard origin(s) in production. Default: [].
cors_allowed_origins = []
# Purpose: serve the bundled SPA from static_ui_dir. Default: false.
serve_static_ui = false
# Purpose: directory of the built SPA assets. Default: "static/ui".
static_ui_dir = "static/ui"

[web.jwt]
# Purpose: plaintext Base64URL-no-pad 32-byte HS256 key.
signing_key = "REPLACE_WITH_JWT_SIGNING_KEY"
# Purpose: token issuer claim. Caution: must match across restarts or all
# sessions invalidate. Default: "quant-pivot".
issuer = "quant-pivot"
audience = "quant-pivot-web"
# Purpose: access-token lifetime (s). Impact: shorter = tighter security,
# more refreshes. Default: 900 (15m).
access_ttl_secs = 900
# Purpose: refresh-token lifetime (s); bounds the maximum session length.
# Default: 604800 (7d).
refresh_ttl_secs = 604800
# Purpose: absolute login-session lifetime. Refresh rotation never extends it.
absolute_session_ttl_secs = 2592000
