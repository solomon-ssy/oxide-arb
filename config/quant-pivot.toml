# ═══════════════════════════════════════════════════════════════════════════════
# quant-pivot — Deploy Configuration (Development)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file contains ONLY deploy configuration: values that are structurally
# bound to a process start (connections, pools, shard counts, channel
# capacities, credentials, web server, logging). Changing anything here
# requires a restart.
#
# Operator tunables (detection, risk, execution operations, settlement
# operations, market-data staleness, notification channels) are NOT here.
# They live in independently revisioned boot-schema policy resources,
# stored in Postgres and managed exclusively through the governed API:
#
# API versioning is header-driven (`Accept-Api-Version: v1`):
#   GET  /api/config/resources                    — resource overview
#   POST /api/config/{kind}/drafts               — create a draft
#   POST /api/config/{kind}/drafts/{id}/validate — validate/preflight
#   POST /api/config/{kind}/drafts/{id}/approve  — record approval
#   POST /api/config/{kind}/drafts/{id}/activate — audited activation
#
# All values shown below are the compiled-in defaults. The file is optional:
# if absent, all defaults apply.
#
# Loading precedence (later wins):
#   1. compiled-in defaults
#   2. quant-pivot.toml        (this file — shipped defaults only)
#   3. quant-pivot.local.toml  (optional, gitignored; local-development only)
#
# Secret fields are plaintext strings wrapped by `SecretText` after parsing.
# Put real local values only in the gitignored `quant-pivot.local.toml`; never
# commit an enabled secret to this shipped defaults file.
#
# Unknown keys are FATAL at startup (deny_unknown_fields): a typo or a stale
# runtime section aborts boot instead of being silently ignored.

# ── Deployment environment ───────────────────────────────────────────────────

[deployment]
environment = "local-development"

# ── Polymarket Platform ───────────────────────────────────────────────────────

[polymarket]
# Purpose: CLOB REST base URL (order placement, balances, market reads).
# Impact: all REST trading traffic. Caution: change only for Polymarket
# endpoint migrations. Default: "https://clob.polymarket.com".
clob_base_url = "https://clob.polymarket.com"
# Purpose: CLOB market-data WebSocket URL (books, ticks).
# Impact: the entire real-time data pipeline. Default shown.
clob_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
# Purpose: hard timeout for the single money-changing POST /order attempt.
# Impact: timeout is Ambiguous and enters reconciliation; it is never retried.
# Default: 45000; must be >= 35000 to contain SDK async-commit enrichment.
order_post_timeout_ms = 45000
clob_market_info_refresh_secs = 900
# Purpose: EVM chain id. Impact: order signing domain + on-chain reads.
# Caution: must be Polygon (137) — any other value is fatal at startup.
# Default: 137.
chain_id = 137

# CTF oracle / on-chain reads + governed redeem transactions.
[polymarket.onchain]
# Purpose: Polygon JSON-RPC endpoint. Impact: CTF resolution oracle and
# on-chain redemption. Public endpoints cannot contain secret-bearing URL
# components; authenticated provider URLs use source = "protected" and a
# plaintext `url` held in memory as `SecretText`.
rpc_endpoint = { source = "public", url = "https://polygon-rpc.com" }
# Purpose: RPC request timeout (ms). Impact: oracle/redeem failure latency.
# Default: 10000.
rpc_timeout_ms = 10000

# Gasless relayer for money-moving Proxy / Gnosis Safe transactions (e.g. CTF
# redeemPositions). Only required when quant.account.wallet_kind is "proxy" or
# "gnosis_safe"; EOA settlement signs + pays gas directly and ignores this.
[polymarket.relayer]
# Purpose: relayer submit/status base URL. Default: "https://relayer-v2.polymarket.com".
base_url = "https://relayer-v2.polymarket.com"
# Purpose: Relayer API key source. Configure only when relayer is enabled.
# api_key = "local-api-key"
# Purpose: address that owns the relayer API key (the signer EOA address).
# api_key_address = "0x...."
# Purpose: relayer HTTP request timeout (ms). Default: 15000.
request_timeout_ms = 15000

# Settlement worker timing and bounded-work limits. Runtime write authority is
# controlled only by system_runtime_control.settlement_write_policy.
[polymarket.settlement]
# Purpose: exclusive PostgreSQL case lease for one settlement worker epoch.
claim_lease_secs = 30
# Purpose: fixed lifetime of one exact SemiAuto settlement batch authorization.
semi_auto_authorization_ttl_secs = 300
discovery_poll_secs = 30
submission_poll_secs = 5
max_claims_per_tick = 32
rpc_concurrency = 4
# Purpose: UI-only signer-free readiness cache; money admission bypasses it.
readiness_ui_cache_secs = 10
external_scan_block_span = 2048
retry_initial_secs = 2
retry_max_secs = 300

# ── Market Data Connections ───────────────────────────────────────────────────
# Decision thresholds are governed policy fields, not Deploy Config.

# Heartbeats: polymarket_client_sdk_v2 (`heartbeats` feature), not app-level ping.
[market_data.websocket]
# Purpose: initial reconnect backoff (ms) after a dropped WS connection.
# Impact: data-gap duration after disconnects. Default: 1000.
reconnect_delay_ms = 1000
# Purpose: reconnect backoff ceiling (ms). Default: 30000.
max_reconnect_delay_ms = 30000
# Purpose: token subscriptions per WS connection before opening a new shard.
# Impact: connection count vs per-connection event volume. Caution: Polymarket
# enforces server-side limits — keep at or below 200. Default: 200.
max_subscriptions_per_connection = 200
# Purpose: maximum engine-owned CLOB token subscriptions across all transport
# shards. Impact: hard caps Polymarket WS pressure; operator Web subscriptions
# remain an overlay. Default: 2000.
engine_max_subscription_tokens = 2000
# Purpose: look-ahead window (hours) for engine WS subscription hotset.
# Impact: markets outside this window stay in catalog/storage but do not consume
# WS capacity until they approach resolution. Default: 72.
engine_subscription_window_hours = 72

[market_data.gamma]
# Purpose: Gamma REST base URL (market catalog + resolution metadata).
# Default: "https://gamma-api.polymarket.com".
base_url = "https://gamma-api.polymarket.com"
# Purpose: interval (s) between full market-catalog syncs (also the periodic
# gamma task cadence). Impact: how quickly new/closed markets are picked up.
# Default: 300.
reconcile_interval_secs = 300
# Purpose: catalog pagination page size. Impact: sync request count.
# Default: 100.
page_size = 100
# Purpose: bound one keyset scan independently of upstream cursor correctness.
max_keyset_pages = 10000
# Purpose: bound all HTTP attempts, including retries, during one keyset scan.
max_keyset_requests = 50000

[market_data.data_api]
# Purpose: Data API base URL for keyless venue position reads
# (GET /positions?user=<funder>). Used to mark the report capital base.
# Default: "https://data-api.polymarket.com".
base_url = "https://data-api.polymarket.com"
# Purpose: positions pagination page size (1..=500). Default: 500.
page_size = 500
# Purpose: minimum token size to include (sizeThreshold). Default: 1.
size_threshold = 1

[market_data.trade_tape_on_chain]
# Purpose: on-chain OrderFilled ingestion for structural participant
# concentration. Default: true.
enabled = true
# Purpose: poll cadence (seconds). Default: 30.
poll_secs = 30
# Purpose: block confirmations before finalizing a chunk. Default: 12.
confirmations = 12
# Purpose: max blocks scanned per contract per tick. Default: 2000.
max_blocks_per_tick = 2000
# Purpose: maximum inclusive block range per eth_getLogs request. Providers
# may enforce lower limits; keep the per-tick budget independent from it.
# Default: 2000.
max_blocks_per_request = 2000
# Purpose: ClickHouse batch size. Default: 1000.
batch_size = 1000
# Purpose: PIT window re-read by the one-to-one WS/on-chain reconciler.
reconciliation_lookback_secs = 3600
# Purpose: maximum absolute event-time distance for an exact match.
reconciliation_match_window_ms = 2000
# Purpose: unmatched WS prints remain Pending until this age, then become unavailable.
reconciliation_terminal_age_secs = 600
# Purpose: hard row cap per reconciliation cycle; overflow fails, never truncates.
reconciliation_max_rows = 100000

# ── External Domain Sources (Phase 11.2.2 crypto vertical) ───────────────────
# Runtime tunables (family enablement, availability lag, backfill depth, basis
# thresholds) are runtime config under `domain.*` — only connections live here.

[domain_sources.binance]
