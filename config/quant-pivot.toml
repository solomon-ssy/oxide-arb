# ═══════════════════════════════════════════════════════════════════════════════
# quant-pivot — Deploy Configuration (Development)
# ═══════════════════════════════════════════════════════════════════════════════
#
# This file contains ONLY deploy configuration: values that are structurally
# bound to a process start (connections, pools, shard counts, channel
# capacities, credentials source, web server, logging). Changing anything here
# requires a restart.
#
# Operator tunables (detection, risk, execution operations, settlement
# operations, market-data staleness, notification channels) are NOT here.
# They live in the versioned runtime configuration (schema_version = 11),
# stored in Postgres and managed exclusively through the governed API:
#
#   GET  /api/runtime-config              — active config (secrets masked)
#   POST /api/runtime-config/versions     — create an immutable version
#   POST /api/runtime-config/versions/{id}/activate — audited hot activation
#
# All values shown below are the compiled-in defaults. The file is optional:
# if absent, all defaults apply.
#
# Loading precedence (later wins):
#   1. QUANT_PIVOT__* environment variables
#   2. quant-pivot.local.toml  (optional, gitignored — copy from
#      quant-pivot.local.toml.example for machine-specific secrets)
#   3. quant-pivot.toml        (this file — shipped defaults only)
#   4. compiled-in defaults
#
# Path separator in env vars is double underscore, e.g. QUANT_PIVOT__DB__POSTGRES__HOST.
#
# Unknown keys are FATAL at startup (deny_unknown_fields): a typo or a stale
# runtime section aborts boot instead of being silently ignored.

# ── Polymarket Platform ───────────────────────────────────────────────────────

[polymarket]
# Purpose: CLOB REST base URL (order placement, balances, market reads).
# Impact: all REST trading traffic. Caution: change only for Polymarket
# endpoint migrations. Default: "https://clob.polymarket.com".
clob_base_url = "https://clob.polymarket.com"
# Purpose: CLOB market-data WebSocket URL (books, ticks).
# Impact: the entire real-time data pipeline. Default shown.
clob_ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
# Purpose: EVM chain id. Impact: order signing domain + on-chain reads.
# Caution: must be Polygon (137) — any other value is fatal at startup.
# Default: 137.
chain_id = 137

# CTF oracle / on-chain reads + governed redeem transactions.
[polymarket.onchain]
# Purpose: Polygon JSON-RPC endpoint. Impact: CTF resolution oracle and
# on-chain redemption. Caution: public RPCs rate-limit — use a dedicated
# provider in production (e.g. https://polygon-mainnet.g.alchemy.com/v2/<KEY>).
# Default: "https://polygon-rpc.com".
rpc_url = "https://polygon-rpc.com"
# Purpose: RPC request timeout (ms). Impact: oracle/redeem failure latency.
# Default: 10000.
rpc_timeout_ms = 10000

# Gasless relayer for money-moving Proxy / Gnosis Safe transactions (e.g. CTF
# redeemPositions). Only required when quant.account.wallet_kind is "proxy" or
# "gnosis_safe"; EOA settlement signs + pays gas directly and ignores this.
[polymarket.relayer]
# Purpose: relayer submit/status base URL. Default: "https://relayer-v2.polymarket.com".
base_url = "https://relayer-v2.polymarket.com"
# Purpose: Relayer API key (secret). Create one from Settings > API Keys on
# polymarket.com. Override: QUANT_PIVOT__POLYMARKET__RELAYER__API_KEY
# api_key = "...."
# Purpose: address that owns the relayer API key (the signer EOA address).
# Override: QUANT_PIVOT__POLYMARKET__RELAYER__API_KEY_ADDRESS
# api_key_address = "0x...."
# Purpose: relayer HTTP request timeout (ms). Default: 15000.
request_timeout_ms = 15000

# Per-category feeRate (official 2026-04-04). Override when PM updates docs.
# Exponent is always 1 per https://docs.polymarket.com/trading/fees
[polymarket.fees]
# Purpose: volatility exponent in fee = C × feeRate × p × (1 − p)^exponent.
# Caution: Polymarket's official value is 1 — do not change without a docs
# update. Default: "1".
exponent = "1"
# Purpose: fallback feeRate for categories missing from category_rates.
# Impact: fee estimation → net-profit gating. Default: "0.05".
unknown_category_rate = "0.05"

# Purpose: per-category feeRate (fraction, not bps). Impact: fee estimation
# feeds directly into expected-net-profit gates — wrong rates mean trading
# unprofitable opportunities or skipping profitable ones. Defaults shown.
[polymarket.fees.category_rates]
geopolitics = "0"
sports = "0.03"
crypto = "0.072"
finance = "0.04"
politics = "0.04"
tech = "0.04"
economics = "0.05"
culture = "0.05"
weather = "0.05"
other = "0.05"

# ── Market Data Connections ───────────────────────────────────────────────────
# (Staleness thresholds are runtime config: market_data.staleness_*.)

# Heartbeats: polymarket_client_sdk_v2 (`heartbeats` feature), not app-level ping.
[market_data.websocket]
# Purpose: initial reconnect backoff (ms) after a dropped WS connection.
# Impact: data-gap duration after disconnects. Default: 1000.
reconnect_delay_ms = 1000
# Purpose: reconnect backoff ceiling (ms). Default: 30000.
max_reconnect_delay_ms = 30000
# Purpose: token subscriptions per WS connection before opening a new shard.
# Impact: connection count vs per-connection event volume. Caution: Polymarket
# enforces server-side limits — keep at or below 200. Default: 200.
max_subscriptions_per_connection = 200
# Purpose: maximum engine-owned CLOB token subscriptions across all transport
# shards. Impact: hard caps Polymarket WS pressure; operator Web subscriptions
# remain an overlay. Default: 2000.
engine_max_subscription_tokens = 2000
# Purpose: look-ahead window (hours) for engine WS subscription hotset.
# Impact: markets outside this window stay in catalog/storage but do not consume
# WS capacity until they approach resolution. Default: 72.
engine_subscription_window_hours = 72

[market_data.gamma]
# Purpose: Gamma REST base URL (market catalog + resolution metadata).
# Default: "https://gamma-api.polymarket.com".
base_url = "https://gamma-api.polymarket.com"
# Purpose: interval (s) between full market-catalog syncs (also the periodic
# gamma task cadence). Impact: how quickly new/closed markets are picked up.
# Default: 300.
full_sync_interval_secs = 300
# Purpose: catalog pagination page size. Impact: sync request count.
# Default: 100.
page_size = 100

[market_data.data_api]
# Purpose: Data API base URL for keyless venue position reads
# (GET /positions?user=<funder>). Used to mark the report capital base.
# Default: "https://data-api.polymarket.com".
base_url = "https://data-api.polymarket.com"
# Purpose: positions pagination page size (1..=500). Default: 500.
page_size = 500
# Purpose: minimum token size to include (sizeThreshold). Default: 1.
size_threshold = 1

# ── Quant Pivot (Phase 0) ─────────────────────────────────────────────────────

[quant.workers]
# Purpose: report TTL expire-sweep cadence (seconds). Serves the
# ReportDeadlineScheduler reconcile/look-ahead interval AND the decoupled
# ReportExpireSweep backstop — NOT report fire scheduling (cadence comes from
# runtime-config reports.schedules[] via tokio-cron-scheduler). Default: 300.
report_expire_sweep_secs = 300
# Purpose: order-intent TTL expire-sweep cadence (seconds). Serves the
# IntentDeadlineScheduler look-ahead AND the IntentExpireSweep backstop that
# releases reserved capital at expires_at. The DB is the source of truth, so a
# missed/duplicated wake only affects latency. Default: 60.
intent_expire_sweep_secs = 60
# Purpose: auto-execution dispatcher poll-backstop cadence (seconds). The
# dispatcher is wake-driven (a fresh ApprovedByPolicy nudges it); this cadence
# catches missed wakes, retries admission defers, and drains crash-recovery
# work. Default: 10.
execution_dispatch_secs = 10
# Purpose: execution-breaker self-heal tick cadence (seconds). Drives
# ExecutionBreaker::tick, which recovers Degraded -> Healthy after cooldown.
# Halted is latched and never auto-heals. Default: 5.
execution_breaker_tick_secs = 5
# Purpose: best-effort strategy-capital equity history cadence (seconds).
# Report generation still writes its own authoritative equity snapshot in the
# report transaction; this worker only adds between-report history points.
# Default: 300.
equity_snapshot_secs = 300

[quant.research_jobs]
# Async research-job engine (dataset build / model train / backtest). These are
# operational/infra knobs, distinct from the frozen per-dataset runtime config
# that governs modeling semantics (captured in dataset_hash).
# Max jobs executing concurrently across all kinds. Default: 2.
global_concurrency = 2
# Per-kind concurrency caps (dataset builds are heaviest — serialize them).
dataset_build_concurrency = 1
model_train_concurrency = 1
backtest_concurrency = 2
# Lease TTL (seconds): a lease not renewed within this window is reclaimable by
# the boot recovery sweep. Default: 90.
lease_ttl_secs = 90
# Running-job lease-renew + liveness heartbeat cadence (seconds). Default: 30.
heartbeat_secs = 30
# Idle poll cadence when the queue is empty or capacity is saturated. Default: 3.
poll_secs = 3
# Bounded automatic crash-recovery re-queues before a job is quarantined to
# failed (poison-pill guard). Default: 3.
max_recovery_attempts = 3
# Hard cap on the deterministic historical spine (selection x instants): a
# dry-run plan beyond this flags hard_cap_exceeded; a build fails closed.
# Default: 2000000.
max_spine_samples = 2000000
# Number of as_of slices sampled during plan to estimate the PIT selection
# keep-rate (0 disables the estimate). Default: 5.
plan_sample_slices = 5
# Candidate markets sampled per slice for the keep-rate estimate; bounds the
# point-in-time reads a plan issues to slices x markets. Default: 200.
plan_sample_markets = 200
# Minimum interval between throttled progress writes (DB heartbeat + WS push), ms.
# Default: 500.
progress_min_interval_ms = 500
# Bounded grace period (seconds) a graceful shutdown waits for in-flight jobs to
# cooperatively unwind at a section/phase boundary before their rows are
# explicitly re-queued for the next epoch. Keep short: a build restarts from
# scratch on re-lease, so draining only lets near-complete work finish. Default: 5.
shutdown_drain_secs = 5

[quant.account]
# Purpose: Polymarket funder address for keyless Data API position reads
# (user=<funder>). Required to generate reports in ALL modes — report_only is not
# dry-run, so sizing is built on the real venue account. For wallet_kind "eoa"
# this MUST equal the signer EOA derived from [keys].private_key; for "proxy" /
# "gnosis_safe" it MUST equal the CREATE2-derived proxy/Safe address controlled
# by that EOA (validated at startup).
# Override: QUANT_PIVOT__QUANT__ACCOUNT__FUNDER
# funder = "0x...."
# Purpose: wallet shape for money-moving on-chain settlement operations.
#   "eoa"         — funds held by the signer EOA; redeem signs + pays gas directly.
#   "proxy"       — Polymarket Proxy (EIP-1167, Magic/email); redeem via relayer.
#   "gnosis_safe" — 1-of-1 Gnosis Safe (browser wallet); redeem via relayer.
# Proxy / Gnosis Safe require [polymarket.relayer] credentials.
wallet_kind = "eoa"

# ── Research Plane (Phase 3) ──────────────────────────────────────────────────

[research]
# Purpose: local filesystem root for the artifact store (training datasets,
# serialized model artifacts), addressed as `file://<artifact_root>/...`.
# Default: "./var/artifacts".
artifact_root = "./var/artifacts"

# ── Keys / Credentials ───────────────────────────────────────────────────────
#
# Only `private_key` is configured. Polymarket CLOB L2 credentials are derived
# automatically by the SDK at connect time (`ClobClient::connect`).
#
# Supply private_key via (env overrides file when both are set):
#   A. QUANT_PIVOT__KEYS__PRIVATE_KEY
#   B. config/quant-pivot.local.toml  (gitignored — recommended on dev laptops)
#   C. Uncomment `private_key` below (not recommended)
#
# All modes require private_key + quant.account.funder: report_only is not
# dry-run — report sizing reads the real venue account. In report_only the key is
# used only for reads; signing/submission applies in semi_auto / auto_execution.
# Never commit real secrets. See docs/operations/runbook.md §3.2.

[keys]
# Bot wallet private key (hex, 0x prefix optional). Rabby bot sub-account export.
# The single signing credential; CLOB L2 read/write credentials are derived from
# it by the SDK at connect time. Override: QUANT_PIVOT__KEYS__PRIVATE_KEY
# private_key = "0x..............................................................."

# ── Observability (logging only) ─────────────────────────────────────────────
# Metrics are always-on via the web server's GET /metrics; operator alerting
# (Telegram / webhook) is runtime config under `notification`.

[observability]
# Purpose: default tracing filter directive (e.g. "info",
# "info,quant_pivot_core=debug"). Impact: log verbosity for the whole process.
# Caution: the RUST_LOG environment variable, when set, overrides this value
# entirely. Default: "info".
log_level = "info"
# Purpose: emit JSON-structured log lines instead of human-readable text.
# Impact: machine-parseable logs for aggregation; enable in production.
# Default: false.
log_json = false

# ── Database ─────────────────────────────────────────────────────────────────

[db.postgres]
# Purpose: Postgres host (system of record: trades, positions, governance,
# RBAC). Default: "localhost".
host = "localhost"
# Purpose: Postgres port. Default: 5432.
port = 5432
# Purpose: role name. Default: "oxide".
user = "oxide"
# Purpose: role password. Caution: set via QUANT_PIVOT__DB__POSTGRES__PASSWORD
# or quant-pivot.local.toml — never commit real values here. Default: "".
password = ""
# Purpose: database name. Default: "oxide_arb".
database = "oxide_arb"
# Purpose: schema search path. Default: "public".
schema = "public"
# Purpose: pool upper bound. Impact: worst-case concurrent repository access;
# size against the server's max_connections. Default: 10.
max_connections = 10
# Purpose: pool warm floor. Default: 2.
min_connections = 2
# Purpose: TCP connect timeout (s). Default: 10.
connect_timeout_secs = 10
# Purpose: idle connection reap timeout (s). Default: 300.
idle_timeout_secs = 300
# Purpose: pool acquire timeout (s). Impact: exceeding indicates pool
# exhaustion — queries fail fast instead of queueing forever. Default: 10.
acquire_timeout_secs = 10
# Purpose: max connection lifetime (s) before recycling. Default: 1800.
max_lifetime_secs = 1800
# Purpose: per-connection statement_timeout (ms); 0 disables. Impact: kills
# runaway queries. Default: 30000.
statement_timeout_ms = 30000
# Purpose: idle_in_transaction_session_timeout (ms); 0 disables. Impact:
# kills idle transactions holding locks. Default: 60000.
idle_in_transaction_timeout_ms = 60000
# Purpose: lock_timeout (ms); 0 disables. Default: 5000.
lock_timeout_ms = 5000
# Purpose: per-operation sort/hash memory, passed verbatim to PostgreSQL.
# Default: "16MB".
work_mem = "16MB"
# Purpose: post-connect self-check that session GUCs took effect (catches
# PgBouncer stripping startup options). Caution: keep enabled in production —
# silently missing statement_timeout is dangerous. Default: true.
verify_session_params = true
# Purpose: prepared-statement cache capacity per connection. Default: 256.
statement_cache_capacity = 256
# Purpose: application name reported to pg_stat_activity. Default: "quant-pivot".
application_name = "quant-pivot"

[db.clickhouse]
# Purpose: ClickHouse HTTP endpoint (analytics timeseries: ticks, books,
# detections, evidence). Default: "http://localhost:8123".
url = "http://localhost:8123"
# Purpose: database name. Default: "oxide_arb".
database = "oxide_arb"
# Purpose: user name. Default: "default".
user = "default"
# Purpose: password. Caution: set via QUANT_PIVOT__DB__CLICKHOUSE__PASSWORD or
# quant-pivot.local.toml — never commit real values here. Default: "".
password = ""
# Purpose: max age (s) of a partial batch before flush. Impact: analytics
# freshness vs insert request volume. Default: 5.
flush_interval_secs = 5
# Purpose: rows per insert batch; a full batch flushes immediately. ClickHouse
# favors large batches — sized for the L2 tick feed (~3K rows/s peaks).
# Default: 5000.
batch_size = 5000
# Purpose: maximum concurrent insert operations (semaphore). Impact: caps
# write pressure on the CH server under high tick rates. Default: 8.
max_concurrent_inserts = 8

# ── Cache ────────────────────────────────────────────────────────────────────

[cache]
# Purpose: global cache operation timeout (ms); per-domain overrides win.
# Default: 500.
operation_timeout_ms = 500
# Purpose: cache failures are transparent to callers (fall through to the
# source of truth). Caution: fail-closed (false) makes Redis a hard
# dependency of every cached read. Default: true.
fail_open = true
# Purpose: disable the entire cache layer (all operations become no-ops).
# Default: false.
disabled = false

[cache.redis]
# Purpose: Redis host (L2 cache + JWT revocation). Default: "localhost".
host = "localhost"
# Purpose: Redis port. Default: 6379.
port = 6379
# Purpose: ACL username. Leave empty for password-only auth (`requirepass`).
# Default: "".
user = ""
# Purpose: password. Caution: set via QUANT_PIVOT__CACHE__REDIS__PASSWORD in
# production — never here. Default: "".
password = ""
# Purpose: logical database index (`SELECT`). Default: 0.
database = 0
# Purpose: connection pool size. Default: 8.
pool_size = 8
# Purpose: per-operation timeout (ms): how long a caller waits for a pooled
# connection at steady state. Default: 1000.
timeout_ms = 1000
# Purpose: startup readiness budget (ms): total time allowed to establish and
# PING the first connection (cache pool + JWT blacklist pool) before the
# process fails closed. Kept separate from timeout_ms so a tight per-operation
# deadline never starves initial connection establishment. Default: 5000.
connect_timeout_ms = 5000
# Purpose: key namespace prefix. Default: "oarb:".
key_prefix = "qp:"

[cache.moka]
# Purpose: in-process (L1) cache entry capacity. Impact: memory vs hit rate.
# TTLs are per-entry, chosen by each call site — no global TTL knob exists.
# Default: 10000.
max_capacity = 10000

# ── Web Server + RBAC ────────────────────────────────────────────────────────

[web]
# Purpose: bind address. Default: "0.0.0.0".
listen_host = "0.0.0.0"
# Purpose: bind port (REST + WS + Prometheus GET /metrics). Default: 8088.
listen_port = 8088
# Purpose: allowed CORS origins; empty disables cross-origin requests.
# Default: [].
cors_allowed_origins = []
# Purpose: serve the bundled SPA from static_ui_dir. Default: false.
serve_static_ui = false
# Purpose: directory of the built SPA assets. Default: "static/ui".
static_ui_dir = "static/ui"

[web.jwt]
# Purpose: HMAC signing secret. SECURITY: never commit a real secret; provide
# it via env in production: QUANT_PIVOT__WEB__JWT__SECRET=<strong-random-secret>.
# Caution: an empty/placeholder secret is fatal in order-submitting modes and a warning
# otherwise. Default: "".
secret = ""
# Purpose: token issuer claim. Default: "quant-pivot".
issuer = "quant-pivot"
# Purpose: access-token lifetime (s). Default: 900 (15m).
access_ttl_secs = 900
# Purpose: refresh-token lifetime (s). Default: 604800 (7d).
refresh_ttl_secs = 604800
