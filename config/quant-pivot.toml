rest_url = "https://api.binance.com"
websocket_url = "wss://stream.binance.com:9443/ws"
archive_url = "https://data.binance.vision"
# Purpose: proactive request-weight budget per minute (klines cost weight
# 2/request; the venue IP budget is 6000/min). Default: 1000.
weight_budget_per_min = 1000
# Purpose: incremental poll cadence (seconds). Default: 30.
kline_poll_secs = 30
# Purpose: if a raw aggTrade stream emits no fact, reconcile the exact
# sequence from the official REST endpoint at this bounded cadence.
agg_trade_recovery_poll_secs = 5
websocket_rotation_secs = 82800
# Purpose: ClickHouse batch size. Default: 5000.
