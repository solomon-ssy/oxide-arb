name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Architecture lint
        run: bash scripts/lint-architecture.sh
      - name: Quant pivot boundary gate
        run: bash scripts/lint-quant-pivot-boundary.sh
      - name: Quant pivot error-layer gate
        run: bash scripts/lint-quant-pivot-errors.sh
      - name: Dead-semantics gate
        run: bash scripts/lint-dead-semantics.sh
      - name: Acceptance-test-coverage gate
        run: bash scripts/lint-acceptance-tests.sh

      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      - name: Run wiremock API tests
        run: cargo test-network

  heavy-ml:
    name: Heavy ML (classical + optimize)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Clippy (research, ml-classical + optimize + dataframe)
        run: cargo clippy -p quant-pivot-research --features ml-classical,optimize,dataframe --all-targets -- -D warnings

      - name: Clippy (core, ml-classical + optimize)
        run: cargo clippy -p quant-pivot-core --features ml-classical,optimize --all-targets -- -D warnings

      - name: Test (research, ml-classical + optimize + dataframe)
        run: cargo test -p quant-pivot-research --features ml-classical,optimize,dataframe

      - name: Test (core, ml-classical + optimize)
        run: cargo test -p quant-pivot-core --features ml-classical,optimize

      - name: Production binary links the classical ML stack
        run: cargo build -p quant-pivot-bin --features ml-classical,optimize

  production-profile:
    name: Production profile (feature completeness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `report_only` is not dry-run: the deployed binary must always link the
      # portfolio optimizer + classical model runtime. The default profile is the
      # production profile (Phase 11.0), so a plain default build must succeed and
      # the explicit full feature set must match it.
      - name: Default binary links the full research stack
        run: cargo build -p quant-pivot-bin

      - name: Explicit production feature set builds
        run: cargo build -p quant-pivot-bin --features lp-solver,optimize,ml-classical

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Compile benchmarks
        run: cargo bench -p quant-pivot-bench --no-run

      - name: Run hot_paths benchmarks (PR regression gate)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-bench-regression.sh

      - name: Enforce absolute micro SLO ceilings
        run: bash scripts/check-bench-slo.sh

      - name: Run e2e path benchmarks
        run: cargo bench -p quant-pivot-bench --bench e2e_paths -- --output-format bencher

      - name: Run benchmarks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/check-bench-regression.sh

      - name: Archive benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp benches/baseline/hot_paths.txt bench_results.txt

      - name: Upload benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench_results.txt
          retention-days: 90

  pgo-build:
    name: PGO Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install llvm-tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: PGO build
        run: bash scripts/pgo.sh

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91"
      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace

  integration-docker:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run Docker integration tests
        run: cargo test-docker

