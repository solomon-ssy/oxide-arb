name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.97.1"
  RUSTFLAGS: "-D warnings"

jobs:
  rust-static:
    name: rust-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency gates
        run: |
          cargo install cargo-machete --locked
          cargo +nightly install cargo-udeps --locked
      - name: Run canonical rust-static gate
        run: bash scripts/check-production-gates.sh rust-static

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Run canonical UI gate
        run: bash scripts/check-production-gates.sh ui
      - name: Archive UI build
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-${{ github.sha }}
          path: ui/apps/web-antdv-next/dist
          retention-days: 14

  network:
    name: network
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Run canonical network gate
        run: bash scripts/check-production-gates.sh network

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Run canonical Docker gate twice
        run: bash scripts/check-production-gates.sh docker

  protected-e2e:
    name: protected-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Run canonical protected E2E gate
        run: bash scripts/check-production-gates.sh protected-e2e
      - name: Archive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protected-e2e-${{ github.sha }}
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore
          retention-days: 30
