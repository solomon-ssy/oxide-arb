name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Architecture lint
        run: bash scripts/lint-architecture.sh

      - name: Build
        run: cargo build --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install critcmp
        run: cargo install critcmp --locked

      - name: Compile benchmarks
        run: cargo bench -p oxide-arb-bench --no-run

      - name: Run hot_paths benchmarks (PR regression gate)
        if: github.event_name == 'pull_request'
        run: bash scripts/check-bench-regression.sh

      - name: Enforce absolute micro SLO ceilings
        run: bash scripts/check-bench-slo.sh

      - name: Run benchmarks
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash scripts/check-bench-regression.sh

      - name: Archive benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp benches/baseline/hot_paths.txt bench_results.txt

      - name: Upload benchmark results
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: bench_results.txt
          retention-days: 90

  pgo-build:
    name: PGO Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install llvm-tools
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: PGO build
        run: bash scripts/pgo.sh

  msrv:
    name: MSRV Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --workspace

  integration-docker:
    name: Integration (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run ignored Postgres integration tests
        run: cargo test -p oxide-arb-repository --test pg_repository -- --ignored --test-threads=1

      - name: Run storage migration integration tests
        run: cargo test -p oxide-arb-storage --test migration_pg -- --ignored --test-threads=1

