name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  GITLEAKS_VERSION: "8.30.1"
  RUST_TOOLCHAIN: "1.97.1"
  RUSTFLAGS: "-D warnings"

jobs:
  secrets:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --show-error --silent --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan complete repository history
        run: >-
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --no-color
          --log-opts="--all" .
      - name: Scan checked-out root and UI trees
        run: >-
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --no-color .

  rust-static:
    name: rust-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-07-16
      - uses: Swatinem/rust-cache@v2
      - name: Install dependency gates
        run: |
          cargo install cargo-machete --version 0.9.2 --locked
          cargo +nightly-2026-07-16 install cargo-udeps --version 0.1.61 --locked
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint all Rust targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check architecture invariants
        run: cargo xtask architecture check
      - name: Check declared dependencies
        run: cargo machete --with-metadata
      - name: Check compiler-observed dependencies
        run: cargo +nightly-2026-07-16 udeps --workspace --all-targets

  rust-unit-contract:
    name: rust-unit-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.140 --locked
      - name: Compile the deterministic test partition
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          cargo nextest run --workspace --profile ci --no-run 2>&1 |
            tee target/ci-evidence/rust-unit-contract-build.log
      - name: Run without external network, Docker, or credentials
        env:
          ALL_PROXY: http://127.0.0.1:9
          DOCKER_HOST: unix:///tmp/quant-pivot-no-docker.sock
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost,::1
          QUANT_PIVOT_BOOTSTRAP__ADMIN_PASSWORD_FILE: /dev/null
          TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: /tmp/quant-pivot-no-docker.sock
          all_proxy: http://127.0.0.1:9
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: 127.0.0.1,localhost,::1
        run: |
          set -euo pipefail
          sudo iptables --insert OUTPUT 1 ! --out-interface lo --jump REJECT
          ipv6_rule=false
          if command -v ip6tables >/dev/null && \
            sudo ip6tables --insert OUTPUT 1 ! --out-interface lo --jump REJECT; then
            ipv6_rule=true
          fi
          cleanup() {
            sudo iptables --delete OUTPUT ! --out-interface lo --jump REJECT
            if [[ "$ipv6_rule" == true ]]; then
              sudo ip6tables --delete OUTPUT ! --out-interface lo --jump REJECT
            fi
          }
          trap cleanup EXIT
          CARGO_NET_OFFLINE=true cargo nextest run --workspace --profile ci 2>&1 |
            tee target/ci-evidence/rust-unit-contract.log
      - name: Archive unit/contract failure evidence (CI-009)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-009-rust-unit-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/rust-unit-contract*.log
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 30

  system:
    name: system
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.140 --locked
      - name: Verify the Docker runtime
        run: |
          set -euo pipefail
          mkdir -p target/ci-evidence
          docker info 2>&1 | tee target/ci-evidence/system-docker-info.log
      - name: Run the shared-infrastructure system suites
        run: |
          set -euo pipefail
          cargo nextest run -p quant-pivot-system-tests --profile system 2>&1 |
            tee target/ci-evidence/system.log
      - name: Archive system failure evidence (CI-009)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-009-system-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-evidence/system*.log
            target/nextest/system/junit.xml
            target/production-stack/*/backend.log
          if-no-files-found: warn
          retention-days: 30

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Verify generated Config API contracts
        working-directory: ui
        run: pnpm check:config-api
      - name: Verify generated research-model API contracts
        working-directory: ui
        run: pnpm check:research-model-api
      - name: Verify generated quant operator API contracts
        working-directory: ui
        run: pnpm check:quant-operator-api
      - name: Verify generated enum catalog
        working-directory: ui
        run: pnpm check:enum-catalog
      - name: Lint UI source and styles
        working-directory: ui
        run: pnpm lint
      - name: Check circular dependencies
        working-directory: ui
        run: pnpm check:circular
      - name: Check declared UI dependencies
        working-directory: ui
        run: pnpm check:dep
      - name: Type-check all UI packages
        working-directory: ui
        run: pnpm check:type
      - name: Type-check browser release contracts
        working-directory: ui
        run: pnpm check:e2e-types
      - name: Run deterministic UI unit and contract tests
        working-directory: ui
        run: pnpm test:unit
      - name: Build the production operator console and enforce bundle policy
        working-directory: ui
        run: pnpm build:antdv-next
      - name: Archive UI test failure evidence (CI-009)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-009-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui/test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 30
      - name: Archive UI build
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-${{ github.sha }}
          path: ui/apps/web-antdv-next/dist
          retention-days: 14

  protected-e2e:
    name: protected-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install UI dependencies
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: ui
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify tracked macOS and Linux visual baselines
        working-directory: ui
        run: pnpm check:visual-snapshots
      - name: Verify the Docker runtime
        run: docker info
      - name: Run production-stack browser E2E
        working-directory: ui
        env:
          PLAYWRIGHT_EVIDENCE_RUN: run-1
          PLAYWRIGHT_PRODUCTION_FIXTURE: governed-feedback
        run: |
          set -euo pipefail
          mkdir -p ../target/ci-evidence
          pnpm exec playwright test \
            --project=functional-chromium \
            --project=visual-desktop-dark \
            --project=visual-desktop-light \
            --project=visual-mobile-dark \
            --project=visual-tablet-dark 2>&1 |
            tee ../target/ci-evidence/protected-e2e-run-1.log
      - name: Repeat browser E2E on a fresh production stack
        working-directory: ui
        env:
          PLAYWRIGHT_EVIDENCE_RUN: run-2
          PLAYWRIGHT_PRODUCTION_FIXTURE: governed-feedback
        run: |
          set -euo pipefail
          pnpm exec playwright test \
            --project=functional-chromium \
            --project=visual-desktop-dark \
            --project=visual-desktop-light \
            --project=visual-mobile-dark \
            --project=visual-tablet-dark 2>&1 |
            tee ../target/ci-evidence/protected-e2e-run-2.log
      - name: Compare fresh-boot release manifests
        working-directory: ui
        run: node scripts/compare-ui-release-manifests.mjs run-1 run-2
      - name: Archive browser failure evidence (CI-009)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-009-protected-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ui/playwright-report
            ui/test-results
            ui/apps/web-antdv-next/test-results/ui-release-closure
            target/ci-evidence/protected-e2e-run-*.log
            target/production-stack/*/backend.log
          if-no-files-found: warn
          retention-days: 30
      - name: Archive UI release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-release-closure-${{ github.sha }}
          path: ui/apps/web-antdv-next/test-results/ui-release-closure
          if-no-files-found: error
          retention-days: 14
