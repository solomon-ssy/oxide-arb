[workspace]
resolver = "2"
members = [
  "crates/quant-pivot-allocator",
  "crates/quant-pivot-compute",
  "crates/quant-pivot-error",
  "crates/quant-pivot-macros",
  "crates/quant-pivot-models",
  "crates/quant-pivot-migration",
  "crates/quant-pivot-api",
  "crates/quant-pivot-storage",
  "crates/quant-pivot-repository",
  "crates/quant-pivot-core",
  "crates/quant-pivot-research",
  "crates/quant-pivot-web",
  "crates/quant-pivot-bin",
  "crates/quant-pivot-bench",
  "crates/quant-pivot-system-tests",
  "crates/quant-pivot-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
clone_on_copy = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# actix-web's request types (`ServiceRequest` / `HttpRequest` / `Next`) are
# `!Send` by design — each worker drives requests on a current-thread runtime —
# so handler and middleware futures are intrinsically non-`Send`. This nursery
# lint is architecturally inapplicable to the web layer; it is a project policy
# decision, not a per-item suppression.
future_not_send = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
# Pin to match polymarket_client_sdk_v2's `futures = "^0.3.32"` (futures-* crates
# must share the same patch version).
futures-util = "0.3.32"
flate2 = "1"
bytes = "1"
object_store = { version = "0.14", features = ["aws", "tokio"] }
aws-config = { version = "=1.8.14", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-s3 = { version = "=1.124.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio", "rustls"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
csv = "1"
# Canonical serde adapters (PickFirst/DisplayFromStr for query-string number
# coercion, rust::double_option for three-way-null PATCH fields, and the
# SerializeDisplay / DeserializeFromStr derives) — never hand-roll these.
serde_with = { version = "3", features = ["macros"] }
sha2 = "0.11"
zip = { version = "7", default-features = false, features = ["deflate"] }

# JSON Schema generation (runtime-config schema metadata; doc comments become
# field descriptions — single source of truth for the UI form renderer)
schemars = { version = "1", features = ["chrono04", "rust_decimal1"] }

# Numeric trait conversions (ToPrimitive, FromPrimitive)
num-traits = "0.2"
ahash = "0.8"
bytestring = "1"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
hdrhistogram = "7.5"
smallvec = "1"

# Process allocator selected for every workspace executable and test harness.
tikv-jemallocator = "0.7.0"
tikv-jemalloc-ctl = { version = "0.7.0", features = ["stats", "use_std"] }

# Decimal arithmetic — never use f64 for money
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "=0.4.44", features = ["serde"] }
# IANA timezone database for wall-clock cron report schedules (pure Rust).
chrono-tz = "0.10"

# NOAA GEFS GRIB2 subset decoding after `.idx` byte-range selection.
grib = "0.15"

# Cron parser shared by schedule preview and the PostgreSQL durable coordinator.
croner = "3"

# Error handling
thiserror = "2"
loom = "0.7.2"
nix = { version = "0.31.3", default-features = false, features = ["fs", "user"] }
tempfile = "3"

# UUID generation (v4 random, v7 time-sortable)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Structured logging
tracing = "0.1"

# Configuration loading (TOML + env vars)

# Async trait (still needed for dyn trait objects)
async-trait = "0.1"

# Enum derive macros
strum = { version = "0.28", features = ["derive"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Binary codec for cache serialization
bitcode = { version = "0.6", features = ["derive", "serde", "rust_decimal"] }

# ORM + migrations (PostgreSQL only)
sea-orm = { version = "=2.0.0", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "entity-registry",
  "with-chrono",
  "with-json",
  "with-ipnetwork",
  "with-rust_decimal",
  "with-uuid",
  "postgres-array",
] }
sea-query = "=1.0.1"
sea-orm-migration = { version = "=2.0.0", default-features = false, features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }
sqlx = { version = "=0.9.0", default-features = false, features = [
  "macros",
  "postgres",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
] }

# Proc-macro infrastructure
syn = { version = "2", features = ["full", "extra-traits", "visit"] }
quote = "1"
proc-macro2 = "1"
linkme = "0.3"
paste = "1"

# ── Venue and market-data adapters ───────────────────────────────────────────

# Polymarket SDK (official v2 — CLOB, WS, Gamma, signing)
polymarket_client_sdk_v2 = { version = "=0.7.0", features = [
  "clob",
  "ws",
  "gamma",
  "tracing",
  "heartbeats",
] }

# Ethereum / Polygon (aligned with SDK's alloy ^1.6.3; pin 1.8 for clarity)
alloy = { version = "1.8", features = [
  "provider-http",
  "signer-local",
  "sol-types",
  "contract",
  "rpc-types",
  "json-rpc",
] }

# HTTP client (aligned with SDK's reqwest ^0.13)
reqwest = { version = "0.13", features = ["json", "rustls", "stream"] }
httpdate = "1"

# TLS: the dependency tree enables both rustls crypto backends (`ring` via
# sea-orm/sqlx, `aws-lc-rs` via reqwest), so the binary must install the
# process-level CryptoProvider explicitly at startup (see quant-pivot-bin).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Concurrency primitives
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
flume = "0.12"

# Retry / backoff
backoff = { version = "0.4", features = ["tokio"] }

# Rate limiting (GCRA algorithm, lock-free)
governor = "0.10"

# Security
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
blake3 = "1"
chainlink-data-streams-report = "1.2.2"
chainlink-data-streams-sdk = { version = "1.2.2", default-features = false, features = ["rest", "websocket", "tracing"] }

# URL parsing
url = "2"

# HTTP mocking (integration tests)
wiremock = "0.6"

# ── Persistence and observability ────────────────────────────────────────────

# Redis connection pool + client
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1.2", features = ["aio", "tokio-comp"] }

# In-process cache (TinyLFU eviction, async, per-entry TTL)
moka = { version = "0.12", features = ["future", "sync"] }

# ClickHouse typed client (official)
clickhouse = { version = "0.15.1", features = ["chrono", "lz4", "uuid"] }

# Prometheus metrics
prometheus = "0.14"

# Telegram Bot API client (push-only alerts; no dispatcher/macros surface).
teloxide-core = { version = "0.13", default-features = false, features = ["rustls"] }

# Test containers (integration tests with real DB)
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

# ── Research / ML stack (feature-gated in quant-pivot-research) ───────────────
#
# `stats` (ndarray/rayon/…) are base deps on `quant-pivot-research`. Polars/Arrow,
# Parquet, and S3 are gated behind `research-jobs`; serving-only builds do not
# link them. ML crates remain separately gated by `optimize` / `ml-classical`.

# stats: numeric matrices, summary statistics, distributions, CPU parallelism
ndarray = "0.17"
statrs = "0.18"
rayon = "1"

# research-jobs: offline feature/dataset materialization (lazy frames + parquet).
# 0.54.4+ fixes chrono <=0.4.41 cap in 0.53 (conflicts with polymarket SDK).
# default-features = false avoids broken `streaming` → polars-stream compile bug.
polars = { version = "=0.54.4", default-features = false, features = ["lazy", "parquet"] }
parquet = "59"

# optimize: factor-weight / threshold optimization
argmin = "0.11"
argmin-math = "0.5"

# ml-classical: tree/ensemble/linear models for shadow candidates
smartcore = "=0.5.5"
# Compact, deterministic serialization of classical model estimators.
# Pinned to the 1.x `serialize`/`deserialize` API that smartcore 0.5 uses.
bincode = "1.3"

# Portfolio MILP optimization. The safe Rust wrapper is used directly so one
# immutable matrix can be re-optimized across exact lexicographic stages.
highs = "=2.3.0"

# ── Web layer and RBAC ────────────────────────────────────────────────────────

# HTTP server stack
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-ws = "0.4"
tracing-actix-web = { version = "0.7", default-features = false }

# Dynamic RBAC authorization engine
casbin = { version = "2", features = ["runtime-tokio"] }

# JWT access/refresh tokens: HS256 with an explicit 256-bit signing key.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# Password hashing (argon2id) — shared by seed + web login
argon2 = "0.5"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }

# CLI / process entrypoints (quant-pivot-bin, quant-pivot-xtask)
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Property-based / snapshot testing
insta = { version = "1.42", features = ["json"] }
proptest = "1.11"

# Serialization helpers
serde_repr = "0.1.20"
toml = "1.1"

# Text / pattern matching
regex = "1.11"

# Random number generation
rand = "0.10"

# actix integration tests (quant-pivot-web)

# ── Internal Crates ──────────────────────────────────────────────────────────

quant-pivot-allocator = { path = "crates/quant-pivot-allocator" }
quant-pivot-compute = { path = "crates/quant-pivot-compute" }
quant-pivot-error = { path = "crates/quant-pivot-error" }
quant-pivot-macros = { path = "crates/quant-pivot-macros" }
quant-pivot-models = { path = "crates/quant-pivot-models" }
quant-pivot-migration = { path = "crates/quant-pivot-migration" }
quant-pivot-api = { path = "crates/quant-pivot-api", default-features = false }
quant-pivot-storage = { path = "crates/quant-pivot-storage" }
quant-pivot-system-tests = { path = "crates/quant-pivot-system-tests" }
quant-pivot-repository = { path = "crates/quant-pivot-repository" }
quant-pivot-core = { path = "crates/quant-pivot-core", default-features = false }
quant-pivot-research = { path = "crates/quant-pivot-research", default-features = false }
quant-pivot-web = { path = "crates/quant-pivot-web" }

[patch.crates-io]
# Exact 0.5.5 source with one narrow, read-only typed XGBoost tree-export API.
# Training and prediction logic remain byte-for-byte upstream.
smartcore = { path = "third_party/smartcore" }

# ═══════════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1

[profile.release-with-debug]
inherits = "release"
debug = "limited"
strip = "none"
