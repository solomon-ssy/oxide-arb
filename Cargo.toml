[workspace]
resolver = "2"
members = [
  "crates/oxide-arb-error",
  "crates/oxide-arb-macros",
  "crates/oxide-arb-models",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decimal arithmetic — never use f64 for money
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# UUID generation (v4 random, v7 time-sortable)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Structured logging
tracing = "0.1"

# Async trait (still needed for dyn trait objects)
async-trait = "0.1"

# Enum derive macros
strum = { version = "0.27", features = ["derive"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Binary codec for cache serialization
bitcode = { version = "0.6", features = ["derive", "serde", "rust_decimal"] }

# ORM + migrations (PostgreSQL only)
sea-orm = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-rust_decimal",
] }

# Proc-macro infrastructure
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.23"

# Internal crates
oxide-arb-error = { path = "crates/oxide-arb-error" }
oxide-arb-macros = { path = "crates/oxide-arb-macros" }
oxide-arb-models = { path = "crates/oxide-arb-models" }

# ═══════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
