[workspace]
resolver = "2"
members = [
  "crates/quant-pivot-error",
  "crates/quant-pivot-macros",
  "crates/quant-pivot-models",
  "crates/quant-pivot-api",
  "crates/quant-pivot-storage",
  "crates/quant-pivot-repository",
  "crates/quant-pivot-core",
  "crates/quant-pivot-research",
  "crates/quant-pivot-web",
  "crates/quant-pivot-bin",
  "crates/quant-pivot-bench",
  "crates/quant-pivot-test-support",
  "crates/quant-pivot-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# actix-web's request types (`ServiceRequest` / `HttpRequest` / `Next`) are
# `!Send` by design — each worker drives requests on a current-thread runtime —
# so handler and middleware futures are intrinsically non-`Send`. This nursery
# lint is architecturally inapplicable to the web layer; it is a project policy
# decision, not a per-item suppression.
future_not_send = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
# Pin to match polymarket_client_sdk_v2's `futures = "^0.3.32"` (futures-* crates
# must share the same patch version).
futures-util = "0.3.32"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Canonical serde adapters (PickFirst/DisplayFromStr for query-string number
# coercion, rust::double_option for three-way-null PATCH fields, and the
# SerializeDisplay / DeserializeFromStr derives) — never hand-roll these.
serde_with = { version = "3", features = ["macros"] }
sha2 = "0.11"

# JSON Schema generation (runtime-config schema metadata; doc comments become
# field descriptions — single source of truth for the UI form renderer)
schemars = "1"

# Numeric trait conversions (ToPrimitive, FromPrimitive)
num-traits = "0.2"
ahash = "0.8"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }

# Decimal arithmetic — never use f64 for money
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database for wall-clock cron report schedules (pure Rust).
chrono-tz = "0.10"

# Report-plane cron/interval/one-shot scheduler (Phase 4). In-process,
# tokio-native; postgres_storage / nats_storage / signal features stay OFF —
# schedule truth source is runtime-config, shutdown is AppRunner-driven.
tokio-cron-scheduler = "0.15"

# Error handling
thiserror = "2"

# UUID generation (v4 random, v7 time-sortable)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Structured logging
tracing = "0.1"

# Configuration loading (TOML + env vars)
config = { version = "0.15", features = ["toml"] }

# Async trait (still needed for dyn trait objects)
async-trait = "0.1"

# Enum derive macros
strum = { version = "0.28", features = ["derive"] }

# Validation
validator = { version = "0.20", features = ["derive"] }

# Binary codec for cache serialization
bitcode = { version = "0.6", features = ["derive", "serde", "rust_decimal"] }

# ORM + migrations (PostgreSQL only)
sea-orm = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-rust_decimal",
  "with-uuid",
  "postgres-array",
] }
sea-orm-migration = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }

# Proc-macro infrastructure
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.23"
linkme = "0.3"
paste = "1"

# ── Phase 1: Data Access Layer Dependencies ──────────────────────────────────

# Polymarket SDK (official v2 — CLOB, WS, Gamma, CTF, signing)
polymarket_client_sdk_v2 = { version = "0.5", features = [
  "clob",
  "ws",
  "gamma",
  "ctf",
  "tracing",
  "heartbeats",
] }

# Ethereum / Polygon (aligned with SDK's alloy ^1.6)
alloy = { version = "1.6", features = [
  "provider-http",
  "signer-local",
  "sol-types",
  "contract",
] }

# HTTP client (aligned with SDK's reqwest ^0.13)
reqwest = { version = "0.13", features = ["json", "rustls"] }

# TLS: the dependency tree enables both rustls crypto backends (`ring` via
# sea-orm/sqlx, `aws-lc-rs` via reqwest), so the binary must install the
# process-level CryptoProvider explicitly at startup (see quant-pivot-bin).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Concurrency primitives
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
flume = "0.12"

# Retry / backoff
backoff = { version = "0.4", features = ["tokio"] }

# Rate limiting (GCRA algorithm, lock-free)
governor = "0.10"

# Security
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"
secrecy = "0.10"

# URL parsing
url = "2"

# HTTP mocking (integration tests)
wiremock = "0.6"

# ── Phase 2: Persistence Layer Dependencies ──────────────────────────────────

# Redis connection pool + client
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1.2", features = ["aio", "tokio-comp"] }

# In-process cache (TinyLFU eviction, async, per-entry TTL)
moka = { version = "0.12", features = ["future", "sync"] }

# ClickHouse typed client (official)
clickhouse = { version = "0.15", features = ["lz4"] }

# Prometheus metrics
prometheus = "0.14"

# Telegram bot (push-only alerts)
teloxide = { version = "0.17", features = ["macros"] }

# Test containers (integration tests with real DB)
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

# ── Phase 3: Research / ML Stack (feature-gated in quant-pivot-research) ──────
#
# `stats` (ndarray/rayon/…) are base deps on `quant-pivot-research`. Polars/Arrow
# are gated behind `dataframe` on that crate; `quant-pivot-core` enables
# `dataframe` for dataset Parquet — report_only binary therefore links polars,
# but the online hot path never calls it. ML crates: `optimize`, `ml-classical`.

# stats: numeric matrices, summary statistics, distributions, CPU parallelism
ndarray = "0.17"
ndarray-stats = "0.7"
statrs = "0.18"
rayon = "1"

# dataframe: offline feature/dataset materialization (lazy frames + parquet).
# 0.54.4+ fixes chrono <=0.4.41 cap in 0.53 (conflicts with polymarket SDK).
# default-features = false avoids broken `streaming` → polars-stream compile bug.
polars = { version = "0.54.4", default-features = false, features = ["lazy", "parquet"] }
arrow = "59"
parquet = "59"

# optimize: factor-weight / threshold optimization
argmin = "0.11"
argmin-math = "0.5"

# ml-classical: tree/ensemble/linear models for shadow candidates
smartcore = "0.5"
# Compact, deterministic serialization of classical model estimators.
# Pinned to the 1.x `serialize`/`deserialize` API that smartcore 0.5 uses.
bincode = "1.3"

# lp-solver: portfolio LP/MILP optimization (good_lp modeling layer).
# `microlp` is the pure-Rust default backend (no native dependency, ships in
# every build); the optional `highs` backend (native) is enabled separately via
# the `lp-solver-highs` feature on quant-pivot-research.
good_lp = { version = "1.15", default-features = false }

# ── Phase 6: Web Layer + RBAC Dependencies ───────────────────────────────────

# HTTP server stack (actix-web 4) — wired in later sub-phases
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-ws = "0.4"
tracing-actix-web = "0.7"

# Dynamic RBAC authorization engine
casbin = { version = "2", features = ["runtime-tokio"] }

# JWT access/refresh tokens.
# jsonwebtoken 10 ships no crypto backend by default (`default = ["use_pem"]`),
# which makes `encode`/`decode` panic at runtime. We sign HS256 only, so we
# select the pure-Rust provider (`rust_crypto`, no native C toolchain) and drop
# the unused PEM parsing pulled in by the default feature.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# actix runtime (integration tests: #[actix_web::test])
actix-rt = "2"

# Password hashing (argon2id) — shared by seed + web login
argon2 = "0.5"

# CLI / process entrypoints (quant-pivot-bin, quant-pivot-xtask)
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Property-based / snapshot testing
proptest = "1"
insta = { version = "1.42", features = ["json"] }

# Serialization helpers
serde_repr = "0.1.20"
toml = "1.1"

# Text / pattern matching
regex = "1.11"

# Random number generation
rand = "0.10"

# actix integration tests (quant-pivot-web)
actix-http = { version = "3", features = ["ws"] }
actix-test = "0.1"

# ── Internal Crates ──────────────────────────────────────────────────────────

quant-pivot-error = { path = "crates/quant-pivot-error" }
quant-pivot-macros = { path = "crates/quant-pivot-macros" }
quant-pivot-models = { path = "crates/quant-pivot-models" }
quant-pivot-api = { path = "crates/quant-pivot-api" }
quant-pivot-storage = { path = "crates/quant-pivot-storage" }
quant-pivot-repository = { path = "crates/quant-pivot-repository" }
quant-pivot-core = { path = "crates/quant-pivot-core" }
quant-pivot-research = { path = "crates/quant-pivot-research" }
quant-pivot-test-support = { path = "crates/quant-pivot-test-support" }
quant-pivot-bench = { path = "crates/quant-pivot-bench" }
quant-pivot-web = { path = "crates/quant-pivot-web" }

# ═══════════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1

[profile.release-with-debug]
inherits = "release"
debug = "limited"
strip = "none"
