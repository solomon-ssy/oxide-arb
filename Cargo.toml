[workspace]
resolver = "2"
members = [
  "crates/oxide-arb-error",
  "crates/oxide-arb-macros",
  "crates/oxide-arb-models",
  "crates/oxide-arb-api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Decimal arithmetic — never use f64 for money
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# UUID generation (v4 random, v7 time-sortable)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Structured logging
tracing = "0.1"

# Configuration loading (TOML + env vars)
config = { version = "0.15", features = ["toml"] }

# Async trait (still needed for dyn trait objects)
async-trait = "0.1"

# Enum derive macros
strum = { version = "0.28", features = ["derive"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Binary codec for cache serialization
bitcode = { version = "0.6", features = ["derive", "serde", "rust_decimal"] }

# ORM + migrations (PostgreSQL only)
sea-orm = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-rust_decimal",
] }

# Proc-macro infrastructure
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.23"

# ── Phase 1: Data Access Layer Dependencies ──────────────────────────────────

# Polymarket SDK (official v2 — CLOB, WS, Gamma, CTF, signing)
polymarket_client_sdk_v2 = { version = "0.5", features = [
  "clob", "ws", "gamma", "ctf", "tracing", "heartbeats",
] }

# Ethereum / Polygon (aligned with SDK's alloy ^1.6)
alloy = { version = "1.6", features = [
  "provider-http", "signer-local", "sol-types", "contract",
] }

# HTTP client (aligned with SDK's reqwest ^0.13)
reqwest = { version = "0.13", features = ["json", "rustls"] }

# Concurrency primitives
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
flume = "0.12"

# Retry / backoff
backoff = { version = "0.4", features = ["tokio"] }

# Rate limiting (GCRA algorithm, lock-free)
governor = "0.10"

# Security
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
secrecy = "0.10"

# URL parsing
url = "2"

# HTTP mocking (integration tests)
wiremock = "0.6"

# ── Internal Crates ──────────────────────────────────────────────────────────

oxide-arb-error = { path = "crates/oxide-arb-error" }
oxide-arb-macros = { path = "crates/oxide-arb-macros" }
oxide-arb-models = { path = "crates/oxide-arb-models" }
oxide-arb-api = { path = "crates/oxide-arb-api" }

# ═══════════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
