[workspace]
resolver = "2"
members = [
  "crates/oxide-arb-error",
  "crates/oxide-arb-macros",
  "crates/oxide-arb-models",
  "crates/oxide-arb-api",
  "crates/oxide-arb-storage",
  "crates/oxide-arb-repository",
  "crates/oxide-arb-control",
  "crates/oxide-arb-algorithm",
  "crates/oxide-arb-risk",
  "crates/oxide-arb-core",
  "crates/oxide-arb-web",
  "crates/oxide-arb-bench",
  "crates/oxide-arb-bin",
  "crates/oxide-arb-test-support",
  "crates/oxide-arb-xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
async_fn_in_trait = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# actix-web's request types (`ServiceRequest` / `HttpRequest` / `Next`) are
# `!Send` by design — each worker drives requests on a current-thread runtime —
# so handler and middleware futures are intrinsically non-`Send`. This nursery
# lint is architecturally inapplicable to the web layer; it is a project policy
# decision, not a per-item suppression.
future_not_send = "allow"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# JSON Schema generation (runtime-config schema metadata; doc comments become
# field descriptions — single source of truth for the UI form renderer)
schemars = "1"

# Numeric trait conversions (ToPrimitive, FromPrimitive)
num-traits = "0.2"
ahash = "0.8"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }

# Decimal arithmetic — never use f64 for money
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Error handling
thiserror = "2"

# UUID generation (v4 random, v7 time-sortable)
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# Structured logging
tracing = "0.1"

# Configuration loading (TOML + env vars)
config = { version = "0.15", features = ["toml"] }

# Async trait (still needed for dyn trait objects)
async-trait = "0.1"

# Enum derive macros
strum = { version = "0.28", features = ["derive"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Binary codec for cache serialization
bitcode = { version = "0.6", features = ["derive", "serde", "rust_decimal"] }

# ORM + migrations (PostgreSQL only)
sea-orm = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
  "macros",
  "with-chrono",
  "with-json",
  "with-rust_decimal",
  "with-uuid",
  "postgres-array",
] }
sea-orm-migration = { version = "1", features = [
  "sqlx-postgres",
  "runtime-tokio-rustls",
] }

# Proc-macro infrastructure
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
darling = "0.23"
linkme = "0.3"

# ── Phase 1: Data Access Layer Dependencies ──────────────────────────────────

# Polymarket SDK (official v2 — CLOB, WS, Gamma, CTF, signing)
polymarket_client_sdk_v2 = { version = "0.5", features = [
  "clob",
  "ws",
  "gamma",
  "ctf",
  "tracing",
  "heartbeats",
] }

# Ethereum / Polygon (aligned with SDK's alloy ^1.6)
alloy = { version = "1.6", features = [
  "provider-http",
  "signer-local",
  "sol-types",
  "contract",
] }

# HTTP client (aligned with SDK's reqwest ^0.13)
reqwest = { version = "0.13", features = ["json", "rustls"] }

# TLS: the dependency tree enables both rustls crypto backends (`ring` via
# sea-orm/sqlx, `aws-lc-rs` via reqwest), so the binary must install the
# process-level CryptoProvider explicitly at startup (see oxide-arb-bin).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }

# Concurrency primitives
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
flume = "0.12"

# Retry / backoff
backoff = { version = "0.4", features = ["tokio"] }

# Rate limiting (GCRA algorithm, lock-free)
governor = "0.10"

# Security
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
blake3 = "1"
secrecy = "0.10"

# URL parsing
url = "2"

# HTTP mocking (integration tests)
wiremock = "0.6"

# ── Phase 2: Persistence Layer Dependencies ──────────────────────────────────

# Redis connection pool + client
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1.2", features = ["aio", "tokio-comp"] }

# In-process cache (TinyLFU eviction, async, per-entry TTL)
moka = { version = "0.12", features = ["future", "sync"] }

# ClickHouse typed client (official)
clickhouse = { version = "0.15", features = ["lz4"] }

# Prometheus metrics
prometheus = "0.14"

# Telegram bot (push-only alerts)
teloxide = { version = "0.17", features = ["macros"] }

# Test containers (integration tests with real DB)
testcontainers = { version = "0.27", features = ["http_wait"] }
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }

# ── Phase 6: Web Layer + RBAC Dependencies ───────────────────────────────────

# HTTP server stack (actix-web 4) — wired in later sub-phases
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-ws = "0.4"
tracing-actix-web = "0.7"

# Dynamic RBAC authorization engine
casbin = { version = "2", features = ["runtime-tokio"] }

# JWT access/refresh tokens.
# jsonwebtoken 10 ships no crypto backend by default (`default = ["use_pem"]`),
# which makes `encode`/`decode` panic at runtime. We sign HS256 only, so we
# select the pure-Rust provider (`rust_crypto`, no native C toolchain) and drop
# the unused PEM parsing pulled in by the default feature.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }

# actix runtime (integration tests: #[actix_web::test])
actix-rt = "2"

# Password hashing (argon2id) — shared by seed + web login
argon2 = "0.5"

# ── Internal Crates ──────────────────────────────────────────────────────────

oxide-arb-error = { path = "crates/oxide-arb-error" }
oxide-arb-macros = { path = "crates/oxide-arb-macros" }
oxide-arb-models = { path = "crates/oxide-arb-models" }
oxide-arb-api = { path = "crates/oxide-arb-api" }
oxide-arb-storage = { path = "crates/oxide-arb-storage" }
oxide-arb-repository = { path = "crates/oxide-arb-repository" }
oxide-arb-control = { path = "crates/oxide-arb-control" }
oxide-arb-algorithm = { path = "crates/oxide-arb-algorithm" }
oxide-arb-risk = { path = "crates/oxide-arb-risk" }
oxide-arb-core = { path = "crates/oxide-arb-core" }
oxide-arb-web = { path = "crates/oxide-arb-web" }
oxide-arb-test-support = { path = "crates/oxide-arb-test-support" }

# ═══════════════════════════════════════════════════════════════════════════════
# Cargo Profile Configuration
# ═══════════════════════════════════════════════════════════════════════════════

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = 1

[profile.release-with-debug]
inherits = "release"
debug = "limited"
strip = "none"
